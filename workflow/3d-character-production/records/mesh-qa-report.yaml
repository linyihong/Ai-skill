# Mesh QA Report — 判斷可否進 rig 所需資料。
# 行為證明：mesh-gate-blocks-rig-v1
schema_version: artifact-record/v1
id: 3d-character.mesh-qa-report
status: draft
runtime_projection:
  enabled: false
  reason: Phase 5 前維持 workflow-local execution contract

record: mesh_qa_report
required_fields:
  topology: { result: [pass, fail], notes: string }
  limb_separation: { result: [pass, fail], notes: string }
  holes_or_nonmanifold: { result: [pass, fail] }
  uv_material: { result: [pass, fail, not_evaluated] }
  scale_orientation: { result: [pass, fail] }
  repairability: [repairable, unrepairable, unknown]

decision:
  enum: [pass, fail]
  scope: geometry_eligibility_for_rig
  fail_when_any:
    - topology.fail
    - limb_separation.fail
    - holes_or_nonmanifold.fail
    - scale_orientation.fail
    - repairability.unrepairable
  pass_requires:
    - topology.pass
    - limb_separation.pass
    - holes_or_nonmanifold.pass
    - scale_orientation.pass
    - repairability in [repairable, unknown]

surface_eligibility:
  facial_and_runtime_ready_requires:
    - uv_material.result == pass
  deferral:
    allowed_for: [exploration, prototype]
    requires:
      - matching known_defect.severity == blocking
      - matching known_defect.disposition == defer
    forbidden_for: runtime-ready

eligibility_consumed_by:
  - artifact-gates.yaml mesh_qa → rigging reads geometry decision
  - artifact-gates.yaml facial_expression/export_runtime reads uv_material
