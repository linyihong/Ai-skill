# Overlay family Core seed — scrim
# 完整 entry = Core 齊。Extended recipe 可 status: unknown。
# scrim 常為其他 overlay recipe 的能力；仍可獨立選型（何時壓暗／鎖背景）。

id: scrim
canonical_pattern: scrim
plain_name: "半透明壓暗層，分隔前景 overlay 與背景內容"
family: overlay
variant_of: overlay
entry_status: declared
evidence_level: observed

intent_examples:
  - dim_background_behind_overlay
  - signal_modal_context
  - optional_dismiss_by_backdrop

selection_rules:
  when:
    - modal_or_temporary_overlay_present
    - need_visual_separation_from_page
    - backdrop_dismiss_allowed_or_blocked_explicitly
  not_when:
    - non_modal_toast_only
    - persistent_push_drawer_without_dim
    - used_as_sole_content_surface
  evidence_level: observed

near_neighbors:
  - id: modal_dialog
    rule: "scrim 是壓暗層；對話內容與決策屬 modal_dialog"
  - id: bottom_sheet
    rule: "sheet 常依賴 scrim；選型主體仍是 bottom_sheet"
  - id: toast
    rule: "toast 預設無 scrim；出現 scrim 則重新評估是否應為 modal"

anti_patterns:
  - scrim_without_foreground_overlay
  - multiple_stacked_scrims_without_reason
  - capturing_clicks_without_declared_dismiss_policy

platform_map:
  aria: none
  headless: None
  project: null  # project overlay fills alias; keep seed free of product names

implementation_recipe:
  status: unknown
  evidence_level: hypothesized
  required:
    - covers_viewport_behind_overlay
    - declared_pointer_policy
  recommended:
    - fade_motion
    - body_scroll_lock_when_modal
