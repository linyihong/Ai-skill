# Overlay family — bottom_sheet

id: bottom_sheet
canonical_pattern: bottom_sheet
plain_name: "從底部抽出的臨時面板，通常帶 scrim"
family: overlay
variant_of: overlay
entry_status: declared
evidence_level: observed

intent_examples:
  - choose_payment_method
  - share_or_export
  - choose_one_of_many_actions
  - contextual_options

selection_rules:
  when:
    - multiple_actions_or_options
    - temporary_context
    - mobile_or_h5_primary
    - non_destructive_choice
    - payment_share_or_picker_list
  not_when:
    - destructive_confirm_primary
    - blocking_alert_required
    - long_multi_step_workflow
    - persistent_navigation
  evidence_level: observed

near_neighbors:
  - id: modal_dialog
    rule: "中央阻斷／確定刪除用 modal_dialog；選付款方式／分享／多選用 bottom_sheet"
  - id: drawer
    rule: "持久導航或側欄並存用 drawer；一次性底部選項用 bottom_sheet"
  - id: toast
    rule: "短暫狀態回饋用 toast；需要多動作選擇用 bottom_sheet"
  - id: scrim
    rule: "bottom_sheet 通常搭配 scrim；主選型仍是 bottom_sheet"

anti_patterns:
  - more_than_10_actions
  - full_form_or_wizard_inside
  - nested_bottom_sheets
  - using_sheet_for_destructive_confirm_only

platform_map:
  aria: dialog
  headless: Dialog
  project: null

implementation_recipe:
  status: partial
  evidence_level: observed
  required:
    - portal
    - scrim
    - focus_trap
    - escape_close
    - body_scroll_lock
  recommended:
    - swipe_dismiss
    - safe_area_inset
    - enter_exit_motion
