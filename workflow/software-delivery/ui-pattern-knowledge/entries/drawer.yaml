# Overlay family — drawer

id: drawer
canonical_pattern: drawer
plain_name: "從側邊滑出的面板；偏導航或與主內容並存的上下文"
family: overlay
variant_of: overlay
entry_status: declared
evidence_level: observed

intent_examples:
  - app_navigation
  - persistent_filters
  - secondary_panel_alongside_content

selection_rules:
  when:
    - persistent_or_semi_persistent_nav
    - side_panel_with_main_content
    - navigation_destinations
    - filter_or_settings_panel_beside_content
  not_when:
    - destructive_confirm_primary
    - transient_status_only
    - single_blocking_alert
    - mobile_one_shot_action_or_payment_list
  evidence_level: observed

# persistent vs temporary、navigation vs task — Phase 2 重點
# temporary/modal drawer：可有 scrim、偏短暫 task panel
# persistent/push drawer：常無 scrim、偏 navigation structure

near_neighbors:
  - id: bottom_sheet
    rule: "持久／側向導航或並存篩選用 drawer；臨時底部選項清單用 bottom_sheet"
  - id: modal_dialog
    rule: "導航結構或並存面板用 drawer；阻斷確認用 modal_dialog"
  - id: toast
    rule: "drawer 不是 feedback；短暫告知用 toast"
  - id: scrim
    rule: "temporary/modal drawer 可搭配 scrim；persistent/push 未必需要"

anti_patterns:
  - packing_primary_destructive_confirm_only
  - treating_drawer_as_toast
  - deep_nested_drawers
  - using_drawer_for_one_shot_payment_picker

platform_map:
  aria: dialog
  headless: Dialog
  project: null

implementation_recipe:
  status: partial
  evidence_level: observed
  required:
    - focus_management
    - escape_or_explicit_close
    - declare_persistent_or_temporary
  recommended:
    - scrim_when_temporary_modal
    - landmark_or_nav_semantics
    - enter_exit_motion
