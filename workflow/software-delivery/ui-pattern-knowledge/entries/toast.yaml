# Feedback family — toast
# Phase 2：Toast 不屬於 Overlay Decision；用來驗證 Family 邊界是否真的有作用。

id: toast
canonical_pattern: toast
plain_name: "短暫、非阻斷的狀態或結果回饋"
family: feedback
variant_of: feedback
entry_status: declared
evidence_level: observed

intent_examples:
  - success_feedback
  - soft_error_notice
  - background_completion_ack

selection_rules:
  when:
    - non_blocking_feedback
    - short_lived_message
    - no_required_decision
    - success_or_soft_status_ack
  not_when:
    - requires_user_choice
    - destructive_confirm
    - persistent_navigation
    - multi_step_or_option_list_content
    - needs_scrim_or_modal_block
  evidence_level: observed

near_neighbors:
  - id: modal_dialog
    rule: "純告知／可略過用 toast；必須決策或確認刪除用 modal_dialog（overlay）"
  - id: bottom_sheet
    rule: "無動作或單一可選 undo 用 toast；多動作／選項用 bottom_sheet（overlay）"
  - id: drawer
    rule: "toast 非導航面；持久導航用 drawer"
  - id: scrim
    rule: "toast 通常不需要 scrim；有 scrim 多半不是 toast"

anti_patterns:
  - stacking_many_toasts
  - using_toast_for_destructive_confirm
  - requiring_modal_focus_trap_on_toast
  - wrapping_toast_in_scrim

platform_map:
  aria: status
  headless: None
  project: null

implementation_recipe:
  status: partial
  evidence_level: observed
  required:
    - auto_dismiss_or_explicit_dismiss
    - non_modal_focus
  recommended:
    - live_region
    - optional_undo_action
