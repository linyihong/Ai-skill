# Composition Constraints — Pattern ↔ Pattern edges (Phase 3+)
#
# This is NOT:
#   - an Entry schema
#   - a Rule Library / playbook dump
#   - Runtime Projection
#
# This IS:
#   Composition Constraint — edges between patterns in a Pattern Tree / Screen.
#   Research signal: Entry + Constraints + Tree ≈ early Knowledge Graph
#   (observed, not promoted as a separate plan line).
#
# === PHASE 3 INVARIANT (anti back-propagation) ===
# Composition evidence MUST NOT modify validated Pattern Knowledge entries.
# New knowledge discovered during composition flows ONLY into THIS file
# (and composition notes / Pattern Tree), NEVER into entries/*.yaml.
# Violation ⇒ Phase 3 evidence invalid until entry edits are reverted.

schema_version: "1.0"
id: workflow.software_delivery.ui_pattern_knowledge.composition_constraints
kind: composition_constraints
status: active
owner_layer: workflow
legacy_filename: composition_rules.yaml   # keep path; semantics = constraints

phase3_invariant:
  id: invariant.no_entry_back_propagation
  statement: >
    Composition evidence MUST NOT modify validated Pattern Knowledge entries.
    New knowledge discovered during composition flows into composition_rules.yaml
    (this file), NOT entries/*.yaml.
  risk: back_propagation
  enforcement: >
    Any git diff under ui-pattern-knowledge/entries/ during Phase 3 dogfood
    fails Composition Closure unless accompanied by an explicit plan revision
    that unfreezes Core (rare; default = revert).

entry_freeze_policy: >
  Alias of phase3_invariant — kept for older readers.
  Phase 3+ must not edit entries/*.yaml to fix composition problems.

# Seed constraints for Episode dogfood (hypothesized; refine only here).
constraints:
  - id: overlay.dialog_requires_scrim
    subject: modal_dialog
    requires:
      - scrim
    rationale: "Blocking dialog recipe includes dim layer; dialog ≠ scrim."
    evidence_level: observed
    hypotheses: [H6]

  - id: overlay.sheet_cannot_contain_dialog
    subject: bottom_sheet
    cannot_contain:
      - modal_dialog
    rationale: "Sheet nests another blocking dialog → nested overlay anti-pattern."
    evidence_level: hypothesized
    hypotheses: [H4, H6]

  - id: feedback.toast_cannot_trigger_selection
    subject: toast
    cannot_trigger:
      - selection
    rationale: >
      Toast is feedback family; co-presence must not re-open Overlay Decision
      or rewrite neighbors' selection_rules (Composition Independence).
    evidence_level: observed
    hypotheses: [H4]

  - id: feedback.toast_forbids_scrim
    subject: toast
    forbids:
      - scrim
    rationale: "Toast + scrim usually means misclassified modal overlay."
    evidence_level: observed
    hypotheses: [H4, H5]
