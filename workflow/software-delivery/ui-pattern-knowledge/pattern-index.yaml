# Discovery index for UI Pattern Knowledge seeds.
# NOT a runtime projection / runtime.db surface.
# Name is pattern-index (not runtime-index) to avoid Runtime Projection confusion.

schema_version: "1.0"
id: workflow.software_delivery.ui_pattern_knowledge.pattern_index
kind: discovery_index
status: active
owner_layer: workflow
note: >
  Lists which Core seed entries exist under entries/.
  Consumers and agents use this for discovery; completeness is validated via
  validation/entry-schema.yaml (not via runtime.compile).
  Phase 2 dogfood verifies overlay family + feedback boundary (toast),
  not entry count growth.

family_focus:
  - overlay
  - feedback   # toast only in wave-1; proves Family gates Selection
entries:
  - id: scrim
    path: entries/scrim.yaml
    family: overlay
    entry_status: declared
    dogfood_order: 1
  - id: modal_dialog
    path: entries/modal_dialog.yaml
    family: overlay
    entry_status: declared
    dogfood_order: 2
  - id: bottom_sheet
    path: entries/bottom_sheet.yaml
    family: overlay
    entry_status: declared
    dogfood_order: 3
  - id: drawer
    path: entries/drawer.yaml
    family: overlay
    entry_status: declared
    dogfood_order: 4
  - id: toast
    path: entries/toast.yaml
    family: feedback
    entry_status: declared
    dogfood_order: 5

deferred_families: []   # e.g. popover / tooltip / fab — after Phase 2 scenarios PASS
