# Interaction Composition Constraints — Interaction ↔ Interaction edges (RC2-P3+)
#
# This is NOT:
#   - an Interaction entry schema
#   - a Rule Library / business workflow dump
#   - Runtime Projection
#
# This IS:
#   Composition Constraint — edges between interaction lifecycles on a Screen / flow.
#
# === RC2-P3 INVARIANT (anti back-propagation) ===
# Interaction Composition evidence MUST NOT modify validated Interaction entries.
# New knowledge discovered during composition flows ONLY into THIS file,
# NEVER into entries/*.yaml.
# Interaction Composition MUST NOT edit ui-pattern-knowledge/entries/* or composition_rules.yaml.
# Violation ⇒ RC2-P3 evidence invalid until entry edits are reverted.

schema_version: "0.1"
id: workflow.software_delivery.ui_interaction_knowledge.interaction_composition_constraints
kind: interaction_composition_constraints
status: draft
owner_layer: workflow
legacy_filename: interaction_composition_rules.yaml

phase: rc2-p3

rc2_p3_invariant:
  id: invariant.no_interaction_entry_back_propagation
  statement: >
    Interaction Composition evidence MUST NOT modify validated Interaction entries.
    New knowledge discovered during composition flows into interaction_composition_rules.yaml
    (this file), NOT entries/*.yaml. Frozen Pattern and Composition layers remain untouched.
  risk: back_propagation
  enforcement: >
    Any git diff under ui-interaction-knowledge/entries/ during RC2-P3 dogfood
    fails Composition Closure unless accompanied by an explicit plan revision
    that unfreezes Interaction entries (rare; default = revert).

entry_freeze_policy: >
  RC2-P3 must not edit entries/*.yaml to fix interaction-composition problems.
  Prefer constraints here; new entry only after Layer + existing-entry mapping fails
  (same discipline as RC2-P2).

# Seed empty — constraints land via CH1–CH3 mini-cycle dogfood only.
constraints:
  # --- CH1 stress 2026-07-15 (Case A): preview gate + confirm_intent pointer channel ---
  - id: interaction.preview_gate_preserves_confirm_semantic_path
    screen: player_immersive_episode
    when_active:
      - preview_gate_transition
    while_nested_lifecycle:
      channel: confirm_intent
    requires:
      semantic_confirm_path:
        - role_button
        - keyboard_enter
        - focus_chain
    forbids_trust:
      pointer_only_on_overlay_actions: true
    rationale: >
      Preview gate overlay captures pointer hits; confirm_intent on the same screen
      must remain reachable via semantic interaction path. Pointer injection alone
      falsifies interaction success (Phase C finding). Composition edge between
      preview_gate_transition and confirm channel — do NOT expand preview entry.
    evidence_level: observed
    hypotheses: [CH1]
    evidence: plans/active/2026-07-14-0856-ui-pattern-knowledge-workflow/evidence/rc2-p3-ch1-independence-stress.md
    consumer_anchor: "<PROJECT_ROOT> episode-coupon-redeem-journey · I-04"

  # --- CH1 stress 2026-07-15 (Case B): owner invalidation before nested confirm ---
  - id: interaction.preview_gate_owner_stable_during_nested_confirm
    screen: player_immersive_episode
    when_active:
      - preview_gate_transition
    while_nested:
      invariant: confirm_root_stable_during_inflight
    forbids_invalidation:
      - preview_limit_cleared_before_confirm_terminal
    rationale: >
      owner-invalidation-before-complete: clearing preview gate owner while confirm
      inflight unmounts confirm root. Composition constraint — do NOT widen
      preview_gate_transition invalidation_event.
    evidence_level: observed
    hypotheses: [CH1]
    evidence: plans/active/2026-07-14-0856-ui-pattern-knowledge-workflow/evidence/rc2-p3-ch1-independence-stress.md
    consumer_anchor: "<PROJECT_ROOT> episode-coupon-redeem-journey · ownership map"
