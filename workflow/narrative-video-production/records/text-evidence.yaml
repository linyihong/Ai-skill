# Text evidence — language / role / relation / regions / boundary (workflow-local)
# runtime_projection.enabled: false
id: narrative-video.text-evidence
runtime_projection:
  enabled: false
description: >
  Per-window OCR/ASR text evidence with language, locale, text_role,
  text_relation, text_region, subtitle_group, and OCR boundary recovery.
  recognition_language (engine) must not dictate observed_script normalize.
  LLM must not invent language tags, region splits, or word boundaries.

fields:
  recognition_language:
    required: false
    notes: >
      OCR engine/model language (e.g. paddle ch/en). Independent from
      observed_script on each region.
  text_region:
    required: [id, text, language_candidate]
    optional:
      - box
      - normalized_box
      - box_size
      - timestamp
      - frame
      - persistence
      - visual_style
      - text_role
      - confidence
      - raw_text
      - boundary
      - derived
      - quality
      - box_count
    language_candidate_notes: >
      Script-family or detector candidate only (en/zh/ja/ko/th/ar/unknown…).
    text_role_enum:
      - translated_subtitle
      - hardcoded_subtitle
      - dialogue_caption
      - signage
      - UI_text
      - watermark
      - title
      - unknown
    boundary:
      optional: [status, reason, recovery_method]
      status_enum: [ok, suspicious, recovered, unresolved]
    derived:
      notes: >
        Candidates only; must not overwrite raw_text.
      candidate_fields: [text, method, status, confidence]
      method_enum:
        - multi_box_space
        - geometry_word_gap
        - ink_projection
        - lexical_candidate
        - closed_class_candidate
        - orthographic_mid_capital
        - script_aware_join
        - script_aware_normalize
      recovery_order_note: >
        existing OCR boxes → intra-box geometry → lexical/closed-class
        candidates → ASR/context → resolver. Closed-class is candidate
        generator only; not first knife / not truth.
    quality:
      optional:
        - frame_width
        - frame_height
        - text_height_px
        - boundary_confidence
  subtitle_group:
    required: [group_id, start, end, regions]
    optional: [type, spatial_relation, language_relation, temporal_overlap]
    type_enum: [mono, bilingual, multi, unresolved]
    spatial_relation_enum: [stacked, overlapping, adjacent, unresolved]
    language_relation_enum:
      - same_language
      - bilingual_pair
      - translation_pair
      - unrelated_text
      - unresolved
  observed_text:
    required: [text, language]
    optional: [locale, text_role, bbox_ref, region_refs, confidence, raw_text]
    notes: >
      Prefer normalized/recovered dialogue text_region(s); keep raw_text for audit.
      Do not collapse bilingual lines into one undifferentiated string when split
      is possible.
  spoken_text:
    required: [text, language]
    optional: [locale, speaker_id, confidence, asr_validity]
  asr_observation:
    required: [observed_text, language]
    optional:
      - phonetic
      - timing
      - speaker_id
      - quality
    notes: >
      observed_text is observation, not spoken meaning SoT.
      phonetic may hold pinyin / syllable / phoneme sequences.
      quality.lexical_confidence signals unnatural phrases for anomaly → reconstruction.
  semantic_anchor:
    required: [source, domain]
    optional: [candidate_meaning, language, status]
    notes: >
      Domain term from OCR observed (e.g. Last Lot → auction).
      Must not overwrite OCR observed; used to generate semantic_reconstruction
      candidates with ASR phonetic / lexical anomaly support.
  semantic_candidate:
    required: [text, from, source_ref]
    optional: [language, status, confidence, semantic_anchor]
    from_enum:
      - ocr_translation
      - ocr_normalize
      - semantic_reconstruction
      - context_hint
    notes: >
      Translation / normalization / semantic_reconstruction candidate.
      Must not overwrite OCR or ASR observed text; provenance via source_ref.
  alignment:
    required: [window_ref]
    optional: [temporal_status, region_refs]
  text_relation:
    required: [type]
    optional: [source_ref, target_ref]
    type_enum:
      - same_language_match
      - same_language_variant
      - cross_language_translation
      - sanitization_candidate
      - unresolved
      - cross_language_unresolved
    notes: >
      May be multi-valued per window (e.g. ocr_en↔asr + ocr_zh↔asr).
      sanitization_candidate only after same-language gate.
      cross_language_translation must not enter sanitization.
      Translation subtitle is semantic evidence only — never spoken_text.
  resolution:
    required: [status]
    optional:
      - spoken_selected
      - subtitle_observed
      - evidence_refs
      - subtitle_group_ref
      - candidates
      - reason
      - sources
      - confidence
    status_enum: [resolved, unresolved, needs_review]
    notes: >
      Multimodal Text Evidence Resolution: select among candidates with
      phonetic + semantic + context support; write reason[] and sources[].
      LLM must not invent text outside the candidate set.
  evidence_disposition:
    required: [candidate_id, source_refs, stage, status, reason]
    optional: [region_refs, merged_into, final_cue_refs, history]
    status_enum: [accepted, uncertain, rejected, merged]
    notes: >
      Every candidate has a stable identity and disposition at each processing
      stage, including cleanup, attribution, classification and fusion.
      rejected requires reason.code; merged requires a resolvable merged_into
      target. Accepted evidence projected into cues retains final_cue_refs.
      State transitions append history; raw observations remain unchanged.
  resolution_funnel:
    required: false
    optional:
      - raw_ocr
      - usable_candidates
      - fused_candidates
      - accepted
      - uncertain
      - rejected
      - merged
      - anomaly_signals
      - reprobe
    notes: >
      Counts describe evidence transitions, not a single quality score. A large
      candidate-to-accepted drop is suspicious only when the non-accepted
      candidates lack traceable uncertain/rejected/merged dispositions.
      anomaly_signals trigger targeted re-probing; they do not silently turn
      candidates into rejects or impose a global wall-clock caption ratio.
  cache_meta:
    required: false
    optional:
      - source_hash
      - ocr_version
      - asr_version
      - region_profile_version
      - fusion_policy_version
      - resolution_version
    notes: >
      Cache reuse requires a valid artifact plus compatible provenance. A policy
      or resolver version change invalidates a derived cue cache rather than
      requiring an operator to guess whether to clear it.
  artifact_integrity:
    required: false
    optional: [status, schema_valid, source_hash_match, write_method, reason]
    status_enum: [valid, invalid, unknown]
    notes: >
      Derived coverage or cue artifacts are valid only after schema validation
      and atomic publication. Invalid artifacts cannot count as a healthy cache
      hit or satisfy a coverage gate.

gates:
  - id: language_tags_present
    rule: aligned OCR/ASR pair must carry language (or explicit unknown) before Text Resolution
  - id: regions_before_bilingual_collapse
    rule: bilingual stacked hardsub windows must expose text_regions or an explicit split-failure note
  - id: recognition_lang_not_space_policy
    rule: recognition_language must not force whitespace deletion on observed latin script
  - id: raw_text_retained_on_boundary_recovery
    rule: boundary recovery must keep raw_text; derived candidates must not overwrite raw
  - id: latin_glue_boundary_marked
    rule: long latin text with zero spaces and single box must set boundary suspicious or attempt recovery
  - id: join_uses_token_seam_not_cumulative_script
    rule: >
      script-aware join must decide spaces from adjacent token seam
      (Latin|Latin => space); must not deny Latin|Latin because
      cumulative observed_script is mixed/cjk; derived text must not
      overwrite parts[]; method script_aware_join must be rebuildable
  - id: sanitization_after_same_language
    rule: sanitization_candidate forbidden when languages differ unless relation is not cross_language_translation
  - id: spoken_not_from_translation_only
    rule: spoken canonical must not be taken from a cross-language translation region when same-language dialogue/ASR exists
  - id: locale_content_uses_resolved_pair
    rule: locale content source must consume resolved spoken/subtitle pair, not raw Latin hardsub as zh spoken
  - id: asr_observed_not_spoken_sot
    rule: asr observed_text must not become spoken canonical without candidate resolution when lexical anomaly or cross-language semantic evidence exists
  - id: semantic_candidate_keeps_ocr_observed
    rule: semantic_candidate must not overwrite OCR observed; provenance source_ref required
  - id: observed_candidate_resolved_layers
    rule: >
      ASR/OCR observed must remain auditable when resolved text differs;
      semantic_reconstruction writes candidates, not silent ASR overwrite
  - id: semantic_anchor_optional_strength
    rule: >
      OCR semantic_anchor strengthens auction/domain reconstruction but is not
      required; ASR+context-only candidates must mark lower confidence
  - id: resolution_reason_required_when_resolved
    rule: status=resolved multimodal selection should carry reason[] and sources[] (evidence_supported path)
  - id: acquisition_monitor_before_story
    rule: >
      overall insufficient or cross_modal suspicious (e.g. ocr_asr_coverage_gap)
      must escalate or defer; must not assert no-subtitle / no-dialogue into Story
  - id: escalation_before_after_recorded
    rule: each acquisition escalation must record trigger, level, action, before, after, resolution
  - id: resolution_funnel_traceable
    rule: >
      every candidate at every stage must remain traceable as accepted with
      sources, uncertain with reason, rejected with reason, or merged with target; anomaly requires targeted reprobe or explicit defer, not silent
      deletion. Missing IDs or dangling merge targets fail accounting even when
      aggregate counts balance.
  - id: spatial_relation_requires_owned_geometry
    rule: >
      stacked requires reliable owned region geometry, temporal support and
      language relation; missing geometry remains spatially unresolved.
  - id: latin_morphology_not_discard_policy
    rule: >
      Latin script or text length alone cannot reject a candidate; uncertain
      role or speech support retains evidence for attribution and recovery.
  - id: derived_artifact_integrity_before_cache_reuse
    rule: >
      invalid JSON/schema, source-hash mismatch, or incompatible cache_meta
      invalidates a derived cue/coverage cache; cache artifacts must be
      validated before atomic publication and before reuse.

