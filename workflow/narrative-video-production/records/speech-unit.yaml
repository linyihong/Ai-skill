# Generated speech / commentary units. TTS 實作不進本契約。
schema_version: artifact-record/v1
id: narrative-video.speech-unit
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；未接 runtime

record: speech_unit
required_fields:
  speech_unit_id: { type: id }
  text: { type: text }
  locale: { type: bcp47 }
  timing_source: { type: enum, values: [speech_artifact, asr] }

optional_fields:
  shot_id: { type: id }
  boundary_type: { type: enum, values: [strong, medium, weak, end], note: punctuation or sentence end; not a line break }
  boundary_source: { type: enum, values: [punctuation, sentence_end, selection] }
  pause: { type: bool }
  speech_artifact_ref: { type: text, note: adapter 產出 id；canonical 不寫 provider }
  duration_s: { type: number }
  cps: { type: number }
  pause_ratio: { type: number }
  speech_timing_gate: { type: gate }
  caption_cue_ref: { type: id }

segmentation:
  ignores: [font_size, max_lines, glyph_width, safe_area]
  punctuation: candidate_not_forced_split
  short_units: may_merge_by_selection_before_tts

invariants:
  - tts_ffmpeg_providers_are_adapters
  - generated_speech_cue_timing_requires_speech_artifact
  - speech_timing_qc_is_not_layout_gate
  - speech_loop_must_not_merge_with_layout_loop
  - no_guessed_cue_duration_for_generated_speech
  - speech_unit_is_spoken_sot_caption_is_visual_projection
  - caption_must_not_rewrite_speech_unit_text
  - line_break_stays_inside_one_speech_unit
  - segmentation_ignores_layout_constraints
  - punctuation_boundary_is_candidate_not_forced_split
  - resegment_regenerates_speech_artifact
