schema_version: artifact-record/v1
id: narrative-video.edit-decision-record
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；未接 runtime

record: edit_decision_record
canonical_form: structured_yaml
human_projection: markdown
rendered_media: output_artifact_not_sot

required_fields:
  film_id: { type: id }
  bible_id: { type: id }
  matching_script_id: { type: id }
  narrative_template_id: { type: id }
  shots: { type: list }

shot_fields:
  - shot_id
  - selected_clip_id
  - source_in
  - source_out
  - selection_policy
  - selection_rationale
  - dialogue  # optional; see dialogue-semantic-context.yaml；trace only, not inferred from mp4

optional_fields:
  external_run_ref: { type: opaque_id, note: required by Phase 3 dogfood evidence; private mapping stays outside this repository }
  title: { type: text }
  profile: { type: id }
  secondary_template_ids: { type: list }
  template_beats: { type: list }
  hook: { type: object }
  mutations: { type: list }
  brief: { type: object }
  publish: { type: object }
  locale_packs: { type: list }
  outcome: { type: object }
  timeline_transform:
    type: object
    note: >
      Publish adapter only. Evidence／matching／EDR decisions stay on source_timebase.
      Example: {type: constant_speed, source_timebase: canonical, target_timebase: publish, rate: 1.5}
      with publish_t = source_t / rate. See source-publish-timebase.md.
  source_timebase: { type: id, note: default canonical; analysis／clip catalog／OCR／ASR }
  publish_timebase: { type: id, note: optional; populated after assemble projection }

qc:
  producer_self_check: { max_maturity: cut-ready }
  fresh_reviewer:
    required_for: publish-ready
    must_differ_from: producer
    required_fields: [reviewer_role, reviewed_artifact_ids, blocking_gate_verdicts, reviewed_at]
    optional_fields: [exceptions, rollback_target]
  timeline_matches_edr: { type: bool }
  temporal_integrity: { type: gate, note: declared transform applied consistently to video／audio／caption }
  presentation_comfort: { type: gate, note: publish readability／lip comfort; not a substitute for sync }

forbidden_fields:
  - inferred_intent_from_mp4
  - composite_quality_score
