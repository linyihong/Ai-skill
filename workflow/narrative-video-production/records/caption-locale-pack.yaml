schema_version: artifact-record/v1
id: narrative-video.caption-locale-pack
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；未接 runtime

record: caption_locale_pack
required_fields:
  locale: { type: bcp47 }
  role: { type: enum, values: [source, commentary, caption] }
  text_origin: { type: enum, values: [script, asr, ocr, human, translated] }
  cues: { type: list }
  content_gate: { type: gate }
  timing_gate: { type: gate }
  layout_gate: { type: gate }

optional_fields:
  layout_script: { type: enum, examples: [cjk, latin] }
  burn_mode: { type: enum, values: [sidecar, burned, none] }
  name_policy: { type: text }
  translation_qc: { type: gate, alias_of: content_gate }
  # Phase 2 — translation adapter (content only; not timing/layout)
  translation_decision_refs:
    type: list
    item: text
    note: TDR ids from workflow/translation; optional until dogfood requires them

cue_optional_fields:
  translation_decision_ref: { type: text, note: per-cue TDR id when translated }
  speech_unit_ref: { type: id, note: generated speech; timing from speech artifact }
  timing_source: { type: enum, values: [speech_artifact, asr] }
  layout:
    type: object
    note: selected layout evidence; lines != max_lines
    fields:
      lines: { type: integer }
      max_lines: { type: integer }
      font_size: { type: number }
      font_size_min: { type: number }
      font_size_max: { type: number }
      typography_scope: { type: enum, values: [cue_uniform] }
      rendered_lines: { type: list, item: text }
      line_break_offsets: { type: list, item: integer }
      protected_spans: { type: list, note: lexical/name/number-unit/idiom/manual no-break spans }
      semantic_break_candidates:
        type: list
        note: scored legal wrap offsets; layout may only pick from this set
      selected_break_offsets: { type: list, item: integer }
      equal_line_length: { type: enum, values: [forbidden] }
      text_integrity_gate: { type: gate, note: concat(rendered_lines) equals cue text; no loss/dup/reorder }
      width_ratio: { type: number }
      selection_policy: { type: text }
      status: { type: enum, examples: [pass, fail] }

invariants:
  - content_gate != timing_gate != layout_gate
  - layout_ok_does_not_imply_readable
  - readable_does_not_imply_safe_area
  - no_single_caption_pass_field
  - content_gate_may_consume_translation_tdr_but_never_implies_timing_or_layout_pass
  - generated_speech_cues_require_speech_artifact_timing
  - max_lines_is_upper_bound_not_target
  - layout_must_record_selected_lines_separately_from_max_lines
  - actual_font_size_must_stay_in_min_max_step
  - line_wrap_must_be_lossless_and_preserve_protected_spans
  - every_line_in_one_cue_uses_one_uniform_typography
  - layout_engine_must_not_segment_or_truncate_cue_text
  - content_integrity_precedes_layout_fit
  - line_breaks_must_come_from_scored_semantic_candidates
  - two_line_layout_must_not_optimize_for_equal_length

inbound:
  - workflow/translation/adapters/subtitle.yaml
  - workflow/narrative-video-production/records/speech-unit.yaml
