schema_version: artifact-record/v1
id: translation.expression-types
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1 doc-only

purpose: >
  Expression type → allowed strategy ids. Seeds Candidate Space.
  Does NOT emit final translations (I10).

invariant:
  - Candidate Space ≠ Final Answer
  - title_mapping / type seeds never auto-select

expression_types:
  literal:
    strategies: [semantic_translation]
  idiom:
    strategies: [semantic_equivalent, cultural_equivalent, literal_plus_explanation]
  proverb:
    strategies: [target_proverb, semantic_equivalent]
  slang:
    strategies: [target_slang, register_preserving_adaptation]
  meme:
    strategies: [cultural_adaptation, preserve_reference]
  dialect:
    strategies: [dialect_equivalent, regional_register, preserve_source_flavor]
  wordplay:
    strategies: [recreate_wordplay, semantic_substitution]
  honorific:
    strategies: [relationship_preserving]
  address_title:
    translation_mode: locale_aware
    strategies: [locale_aware, target_locale_equivalent]
    components: [title, name]
    note: title_mapping seeds Candidate Space only
  name_with_address_title:
    translation_mode: locale_aware
    strategies: [locale_aware]
    components: [proper_name, address_title]
    handling:
      proper_name: name_realization
      address_title: locale_aware
    realization:
      proper_name_ref: registry/realization-strategies.yaml
      note: Latin transliteration ≠ completed ja-JP katakana realization
  cultural_reference:
    strategies: [preserve, adapt, explain]
  proper_noun:
    strategies: [terminology_table, transliterate, preserve]
  proper_name_transliteration:
    strategies: [transliterate, preserve_identity]
    note: umbrella; prefer Target-Locale Realization strategies for script-specific forms
  terminology:
    strategies: [terminology_table, transliterate, preserve]
  title:
    strategies: [title_faithful, title_semantic_adaptation]
    note: requires content.type=title; Title Structure Analysis first
  title_idiom:
    strategies: [semantic_equivalent, cultural_equivalent, title_semantic_adaptation, literal_plus_explanation]
    note: lexical form ≠ contextual meaning; Candidate Space must carry ambiguity
  title_wordplay:
    strategies: [recreate_wordplay, semantic_substitution, title_semantic_adaptation]
  title_hook:
    strategies: [title_semantic_adaptation, preserve_drama_hook]
  part_marker:
    strategies: [part_normalization]
    examples: [上, 下, Part One]
  occupation:
    strategies: [semantic_equivalent, terminology_table]
    note: e.g. 空姐 as protagonist_descriptor in titles
  grammatical_marker:
    strategies: [structural_render]
    note: e.g. 被 as passive_marker — do not over-narrativize without policy
  temporal_reference:
    strategies: [semantic_equivalent, locale_aware]
    constraints: [preserve_temporal_direction]
    note: >
      tonight/this-evening/last-night families — abstract, not per-gloss prompt
      cases. Linked failure_pattern: temporal_direction_flip.
  temporal_clock:
    strategies: [preserve_numeric_time, locale_clock_form]
    constraints: [preserve_numeric_time]
    note: >
      Mechanical clock value must match source. Linked failure_pattern:
      clock_time_shift. Not solved by prompt examples.

knowledge_seeds:
  title_mapping:
    role: candidate_space_seed_only
    path_direction: knowledge/translation/locale/title-mapping.yaml
    forbidden: use_as_final_answer_without_selection
  name_realization:
    role: candidate_space_seed_only
    path_direction: knowledge/translation/locale/<locale>/name-realization.yaml
    example: knowledge/translation/locale/ja-JP/name-realization.yaml
    forbidden: use_as_final_answer_without_selection
  address_title_locale:
    role: candidate_space_seed_only
    path_direction: knowledge/translation/locale/<locale>/address-title.yaml
    example: knowledge/translation/locale/ms-MY/address-title.yaml
    forbidden: use_as_final_answer_without_selection
  temporal_reference:
    role: candidate_space_seed_only
    path_direction: knowledge/translation/locale/temporal-reference.yaml
    forbidden: use_as_final_answer_without_selection
