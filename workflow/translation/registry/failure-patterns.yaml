schema_version: artifact-record/v1
id: translation.failure-patterns
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；doc-only — CROSS-LOCALE CORE only

purpose: >
  Cross-locale Failure Registry. Seeds Constraints / Validation for every
  target_locale. Does NOT hold ja-/id-/en-specific pattern bodies — those live
  under registry/locale/<locale>/failure-patterns.yaml as manifestations.
  Not a prompt case dump (I10 / I13).

promotion:
  candidate_author: any_actor_including_llm
  active_author: governance_review_only
  see: contracts/failure-pattern.yaml

locale_binding:
  index: registry/locale-failure-taxonomy.yaml
  rule: >
    After Locale Resolution: Constraint Space =
    this core registry ∪ registry/locale/<target_locale>/failure-patterns.yaml
    Missing locale file → core only; do not invent prompt rules.

patterns:
  - id: incomplete_source_completion
    status: active
    taxonomy_id: CORE-F21
    scope: cross_locale
    responsibility: constraint
    classification: { type: other }
    response:
      constraint: { prohibit: [invented_completion_of_truncated_source] }
      validation: { column: completeness, rule: incomplete_source_block }
    note: I21 — Evidence insufficiency ≠ permission to infer missing content.

  - id: semantic_role_loss
    status: active
    taxonomy_id: F1
    scope: cross_locale
    responsibility: constraint
    classification: { type: semantic_role_loss }
    response:
      constraint:
        require: semantic_role_completeness
        prohibit: [dropping_agent_patient_recipient_without_evidence]
      validation: { column: semantic_roles, rule: semantic_role_preservation }

  - id: grammatical_relation_error
    status: active
    taxonomy_id: F2
    scope: cross_locale
    responsibility: constraint
    classification: { type: grammatical_relation_error }
    response:
      constraint: { require: role_to_target_grammatical_realization }
      validation: { column: grammatical, rule: grammatical_relation_consistency }

  - id: target_syntax_distortion
    status: active
    taxonomy_id: F3
    scope: cross_locale
    responsibility: constraint
    classification: { type: target_syntax_distortion }
    response:
      constraint:
        prohibit: [require_source_word_order]
        allow: [target_syntax_reorder_under_I15]
      validation: { column: syntactic, rule: target_syntax_vs_source_order }

  - id: unnatural_surface_realization
    status: active
    taxonomy_id: F4
    scope: cross_locale
    responsibility: selection_constrained
    classification: { type: unnatural_surface_realization }
    response:
      validation: { column: naturalness, rule: naturalness_under_I16 }

  - id: social_address_misinterpretation
    status: active
    taxonomy_id: F5
    scope: cross_locale
    responsibility: constraint
    classification: { type: social_address_misinterpretation }
    response:
      constraint:
        prohibit: [literal_age_gloss_without_evidence]
        require: social_address_candidate_space
      validation: { column: semantic, rule: social_address_not_literal_age }
    note: Core concept; ja 老張→オヤジ is locale manifestation JA-F11 + F5.

  - id: idiom_literalization
    status: active
    taxonomy_id: F6
    scope: cross_locale
    responsibility: constraint
    classification: { type: idiom_literalization }
    response:
      constraint: { prohibit: [literal_idiom_as_sole_candidate] }
      validation: { column: semantic, rule: title_idiom_without_ambiguity_space }

  - id: foreign_honorific_leak
    status: active
    taxonomy_id: F7
    scope: cross_locale
    responsibility: constraint
    classification: { type: target_locale_residue }
    response:
      constraint:
        require: native_locale_honorific_candidate
        prohibit: [untranslated_foreign_honorific_as_sole_feasible]
      validation:
        column: locale_consistency
        rule: title_honorific_consistency
    note: Manifests differently per locale (Miss/Ms., etc.) via locale registry + knowledge.

  - id: target_locale_residue
    status: active
    taxonomy_id: F7b
    scope: cross_locale
    responsibility: constraint
    classification: { type: target_locale_residue }
    response:
      validation: { column: locale_consistency, rule: target_locale_residue }

  - id: source_language_residue
    status: active
    taxonomy_id: F7c
    scope: cross_locale
    responsibility: constraint
    classification: { type: source_language_residue }
    response:
      validation:
        column: mechanical.source_language_residue
        rule: source_language_residue

  - id: name_realization_incomplete
    status: active
    taxonomy_id: F8
    scope: cross_locale
    responsibility: constraint
    classification: { type: name_realization_incomplete }
    response:
      constraint:
        prefer: realization_profile.preferred_script
        forbid_hard_fail: all_non_preferred_scripts
      validation: { column: name_realization, rule: name_realization_incomplete }
    note: Locale manifests (e.g. JA-F06) refine script/policy; mapping ≠ final answer.

  - id: invented_information
    status: active
    taxonomy_id: F9
    scope: cross_locale
    responsibility: constraint
    classification: { type: invented_information }
    response:
      constraint:
        prohibit: [unsupported_marketing_claim, marketing_generation_without_evidence]
      validation: { column: invented_information, rule: invented_information }

  - id: semantic_expansion
    status: active
    taxonomy_id: F10
    scope: cross_locale
    responsibility: constraint
    classification: { type: semantic_expansion }
    response:
      constraint: { prohibit: [fluency_added_predicates_entities] }
      validation: { column: semantic_expansion, rule: semantic_expansion_guard }
    note: I18. JA dogfood manifestation historically labeled JA-F04.

  - id: modality_loss
    status: active
    taxonomy_id: F11
    scope: cross_locale
    responsibility: constraint
    classification: { type: modality_loss }
    response:
      constraint: { require: modality_uncertainty_trace }
      validation: { column: modality, rule: modality_preservation }
    note: Cross-locale concept; JA-F10 is ja manifestation, not a second invent.

  - id: register_drift
    status: active
    taxonomy_id: F12
    scope: cross_locale
    responsibility: constraint
    classification: { type: register_drift }
    response:
      constraint: { require: register_band_match }
      validation: { column: register, rule: register_band_preservation }
    note: I20. JA-F07 is ja manifestation.

  - id: false_cognate_or_lexical_decomposition
    status: active
    taxonomy_id: F13
    scope: cross_locale
    responsibility: constraint
    classification: { type: chinese_lexical_false_cognate }
    response:
      constraint:
        require: lexicalized_or_pragmatic_candidate
        prohibit: [character_wise_decomposition_as_sole_feasible]
      validation: { column: semantic, rule: false_cognate_guard }
    note: I17. High risk zh→ja kanji friends; JA-F01 manifests.

  - id: pragmatic_construction_literalization
    status: active
    taxonomy_id: F14
    scope: cross_locale
    responsibility: constraint
    classification: { type: chinese_pragmatic_construction_literalization }
    response:
      constraint:
        require: speech_act_or_pragmatic_candidate_space
        prohibit: [dictionary_gloss_as_sole_feasible]
      validation: { column: semantic, rule: pragmatic_construction_guard }
    note: JA-F02／JA-F09 are ja manifestations of this family.

  - id: modifier_role_misinterpretation
    status: active
    taxonomy_id: F15
    scope: cross_locale
    responsibility: constraint
    classification: { type: social_address_misinterpretation }
    response:
      constraint:
        require: modifier_role_analysis_before_composition
        prohibit: [literal_composition_of_social_modifier_plus_name]
      validation: { column: semantic, rule: social_address_not_literal_age }
    note: >
      老張 composition error. Core concept; JA-F11 is ja manifestation.
      Related to F5 social_address_misinterpretation.

  - id: temporal_direction_flip
    status: candidate
    taxonomy_id: F16
    scope: cross_locale
    responsibility: constraint
    classification: { type: temporal_direction_flip }
    response:
      constraint: { require: preserve_temporal_direction }
      validation: { column: semantic, rule: temporal_direction_consistency }

  - id: clock_time_shift
    status: active
    taxonomy_id: F17
    scope: cross_locale
    responsibility: constraint
    classification: { type: clock_time_shift }
    response:
      constraint: { require: preserve_numeric_time }
      validation: { column: mechanical, rule: clock_time_numeric_match }

disposition_question: >
  New dogfood error → new core concept, or locale manifestation of existing core?
  Never "append another case to the Selection prompt".
