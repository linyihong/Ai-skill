schema_version: artifact-record/v1
id: translation.locale-failure-taxonomy
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；doc-only index into failure-patterns.yaml

purpose: >
  Locale-scoped Failure Taxonomy index. After Locale Resolution, Selection /
  Validation MUST bind the active taxonomy for target_locale (and optionally
  source_locale pair). Patterns themselves live in registry/failure-patterns.yaml
  — this file only routes which taxonomy_ids apply. Not a prompt case dump (I13).

binding:
  when: after_locale_resolution
  stage: execution-flow step 6–7 (Registry + Apply Constraints / Guards)
  rule: >
    Load locale_taxonomies[target_locale] (+ pair overlays when present).
    Missing locale → use cross_locale_core only; do not invent prompt rules.

cross_locale_core:
  note: Always active regardless of locale
  taxonomy_ids:
    - F1   # semantic_role_loss
    - F2   # grammatical_relation_error
    - F3   # target_syntax_distortion
    - F4   # unnatural_surface_realization
    - F5   # social_address_misinterpretation
    - F6   # idiom_literalization (via idiom_literalization pattern)
    - F7   # foreign_honorific_leak / target_locale_residue family
    - F8   # name_script_mismatch
    - F9   # invented_information
    - CORE-F21  # incomplete_source_must_not_be_completed (I21)

locale_taxonomies:
  ja-JP:
    id: JA
    pair_hint: zh→ja
    status: active
    taxonomy_ids:
      - JA-F01  # chinese_lexical_false_cognate
      - JA-F02  # chinese_pragmatic_construction_literalization
      - JA-F03  # semantic_role_or_modifier_loss
      - JA-F04  # semantic_expansion
      - JA-F05  # kinship_target_residue
      - JA-F06  # foreign_name_realization_zh_ja
      - JA-F07  # register_drift
      - JA-F08  # idiom_literalization_ja
      - JA-F09  # pragmatic_ambiguity
      - JA-F10  # modality_loss
    evidence:
      - plans/active/2026-09-22-1000-translation-decision-workflow/evidence/2026-09-29-ep7-ja-dogfood.md
      - plans/active/2026-09-22-1000-translation-decision-workflow/evidence/2026-09-29-ep8-ja-walkthrough.md
    companion: plans/active/2026-09-22-1000-translation-decision-workflow/12-ja-pragmatic-lexical.md

  id-ID:
    id: ID
    pair_hint: zh→id
    status: active_minimal
    taxonomy_ids:
      - F7   # honorific / Miss Chen residue
    note: Expand ID-F* only with dogfood evidence (陈小姐 → Miss Chen).

  ms-MY:
    id: MS
    pair_hint: zh→ms
    status: candidate
    taxonomy_ids:
      - F7   # foreign_honorific_leak (Cik/Puan)
    note: Expand MS-F* only with dogfood evidence.

  en-US:
    id: EN
    status: candidate
    taxonomy_ids: []
    note: Prefer cross_locale_core until EN-specific dogfood lands.

  ar:
    id: AR
    status: placeholder
    taxonomy_ids: []
    note: Do not invent AR-F* without evidence.

invariants:
  - Locale taxonomy is Constraint／Validation routing — not Selection prompt text
  - New locale codes start as placeholder／candidate until ≥1 evidence run
  - AI may propose locale-F candidates; Governance Review alone activates (I13)

forbidden:
  - if_locale_prompt_case_lists
  - activating_placeholder_taxonomy_without_evidence
  - duplicating_full_pattern_bodies_here
