schema_version: artifact-record/v1
id: translation.validation-rules
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1 doc-only

purpose: Named mechanical / locale rules for validation.yaml dimensions.

rules:
  - id: segment_coverage
    column: mechanical.segment_coverage
    check: every source span accounted for or explicitly omitted with reason

  - id: placeholders_intact
    column: mechanical.placeholders
    check: variables / ICU / markup placeholders preserved

  - id: source_language_residue
    column: mechanical.source_language_residue
    check: no unintended source-language tokens in dst
    distinct_from: target_locale_residue

  - id: target_locale_residue
    column: locale_consistency
    check: dst forms consistent with authoritative target_locale
    default_on_mismatch: review
    reason_code: target_locale_residue
    examples:
      - target_locale: id-ID
        dst: "Miss Chen"
        expect: review
      - target_locale: id-ID
        dst: "Ms. Chen"
        expect: review
      - target_locale: id-ID
        dst: "Nona Chen"
        expect: pass

  - id: title_honorific_consistency
    column: locale_consistency
    check: address titles drawn from locale-aware Candidate Space or waivered

  - id: name_realization_incomplete
    column: name_realization
    check: >
      When realization_profile declares preferred_script (e.g. katakana for ja-JP
      foreign names), Latin-only surname + correct honorific (Chenさん) → review
      with reason name_realization_incomplete. Distinct from target_locale_residue.
    default_on_mismatch: review
    reason_code: name_realization_incomplete
    examples:
      - target_locale: ja-JP
        dst: "Chenさん"
        expect: review
      - target_locale: ja-JP
        dst: "チェンさん"
        expect: pass
    forbidden: hard_fail_all_non_katakana

  - id: invented_information
    column: invented_information
    check: >
      Dst must not introduce hashtags/claims/plot/emotion absent from
      source+evidence unless allow_marketing_expansion=true and marketing_tags
      present. Distinct from idiom semantic uncertainty (semantic=review).
    default_on_mismatch: fail
    reason_code: unsupported_marketing_claim
    examples:
      - source: "空姐被一日千里-上"
        dst_extra: "#ギリギリのセクシーなドラマ"
        expect: fail
      - source: "空姐被一日千里-上"
        dst: "CAが一日千里-上"
        expect: pass_or_review_on_idiom_only

  - id: title_idiom_without_ambiguity_space
    column: semantic
    check: >
      For content.type=title with idiom span, sole literal/English gloss guess
      without Candidate Space ambiguity → review (literal_idiom_mistranslation risk)
    default_on_mismatch: review
    reason_code: idiom_semantic_uncertain

  - id: temporal_direction_consistency
    column: semantic
    check: >
      temporal_reference spans must preserve past/present/future direction
      relative to source (今晚 ≠ 昨晚). Linked failure_pattern:
      temporal_direction_flip.
    default_on_mismatch: review
    reason_code: temporal_direction_flip

  - id: clock_time_numeric_match
    column: mechanical
    check: >
      temporal_clock spans must preserve numeric clock value (八点半 → 08:30
      or locale equivalent). 07:30 / 20:30 without source evidence → fail.
      Mechanical — not a Selection prompt rule. Linked: clock_time_shift.
    default_on_mismatch: fail
    reason_code: clock_time_shift

  - id: semantic_role_preservation
    column: semantic_roles
    check: >
      Source semantic_structure arguments/roles present in target (or
      recoverably omitted per target grammar). Missing agent/patient/recipient
      without evidence → fail/review (F1 semantic_role_loss).
    default_on_mismatch: fail
    reason_code: semantic_role_loss

  - id: grammatical_relation_consistency
    column: grammatical
    check: >
      Case/particle/preposition/modifier attachment realizes roles in target
      grammar — not literal particle copy. Linked F2.
    default_on_mismatch: review
    reason_code: grammatical_relation_error

  - id: target_syntax_vs_source_order
    column: syntactic
    check: >
      Do NOT require source word order. Flag only when surface order/copy
      breaks target syntax while roles exist (F3). Reorder under I15 is OK.
    default_on_mismatch: review
    reason_code: target_syntax_distortion
    forbidden: require_source_token_order_equals_target

  - id: naturalness_under_I16
    column: naturalness
    check: >
      Fluency/naturalness review must not alter roles, entities, temporal,
      polarity, or intent (I16). Distinct from grammatical (F4).
    default_on_mismatch: review
    reason_code: unnatural_surface_realization

  - id: social_address_not_literal_age
    column: semantic
    check: >
      social_address_marker (老/小/阿) defaults to familiarity — not age/kin
      gloss (オヤジ) without evidence (F5).
    default_on_mismatch: fail
    reason_code: social_address_misinterpretation
    examples:
      - source: "老張"
        dst: "オヤジ張さん"
        expect: fail
      - source: "老張"
        dst: "張さん"
        expect: pass_or_review_on_name_only

  - id: false_cognate_guard
    column: semantic
    check: >
      lexical_handling.mode=false_cognate_risk or lexicalized kinship MUST NOT
      accept character-wise zh→ja kanji friend as sole feasible (老婆→お婆さん).
      JA-F01 / I17.
    default_on_mismatch: fail
    reason_code: chinese_lexical_false_cognate
    examples:
      - source: "老婆"
        dst: "お婆さん"
        expect: fail
      - source: "老婆"
        dst: "妻"
        expect: pass

  - id: pragmatic_construction_guard
    column: semantic
    check: >
      speech_act_expression / construction / 装矜持-class MUST NOT pass on
      dictionary/hanzi-swap sole Candidate (说了她两句→言及; 矜持を装う). JA-F02/F08.
    default_on_mismatch: fail
    reason_code: chinese_pragmatic_construction_literalization

  - id: semantic_expansion_guard
    column: semantic_expansion
    check: >
      Fluency must not add unsupported predicates/entities (振る舞い). Distinct
      from marketing invented_information. JA-F04 / I18.
    default_on_mismatch: fail
    reason_code: semantic_expansion
    examples:
      - source: "我老婆也太反常了"
        dst: "妻の振る舞いが異常すぎる"
        expect: fail

  - id: modality_preservation
    column: modality
    check: >
      Speculative/tentative force (该不会…吧) and speech-act force must leave
      a recoverable trace. Bare したの？ may be naturalness OK but modality review/fail.
      JA-F10 / I19.
    default_on_mismatch: review
    reason_code: modality_loss

  - id: register_band_preservation
    column: register
    check: >
      Colloquial/dialogue source elevated to classical/literary (べし) without
      evidence → fail or review. Meaning-correct ≠ register-correct. JA-F07 / I20.
    default_on_mismatch: review
    reason_code: register_drift

  - id: untranslated_kinship_residue
    column: locale_consistency
    check: >
      Source kinship/relationship tokens left untranslated in ja-JP (姐夫)
      → fail. Mechanical/locale — not LLM "readable enough". JA-F05.
    default_on_mismatch: fail
    reason_code: target_locale_residue

  - id: pragmatic_ambiguity_review
    column: semantic
    check: >
      Ambiguous pragmatic terms (应酬, 长草) without context/Candidate Space
      → review. JA-F09.
    default_on_mismatch: review
    reason_code: pragmatic_ambiguity

  - id: incomplete_source_block
    column: completeness
    check: >
      Truncated/incomplete source MUST NOT be completed by Selection.
      finality.status=blocked (I21 / CORE-F21).
    default_on_mismatch: fail
    reason_code: source_truncated

  - id: no_scalar_quality
    column: meta
    check: forbid translation_quality / confidence scalar as closure

invariants:
  - id: I8
    rule: source_language_residue and target_locale_residue remain separate
  - id: I11
    rule: name_realization column distinct from locale_consistency
  - id: I12
    rule: invented_information column distinct from semantic idiom uncertainty
  - id: I13
    rule: failure_pattern status=active only via Governance Review
  - id: I14
    rule: preserve semantic relations, not source surface form
  - id: I15
    rule: target reorder/omit OK only with preserved semantic relations
  - id: I16
    rule: naturalness must not alter roles/entities/temporal/polarity/intent
  - id: I17
    rule: false cognate / kanji decomposition flagged; no sole kanji gloss
  - id: I18
    rule: semantic_expansion ≠ invented_information; both block without waiver
  - id: I19
    rule: preserve participants/event/modality/polarity
  - id: I20
    rule: register drift is a validation failure mode
  - id: I21
    rule: incomplete_source_must_not_be_completed → blocked
  - id: I22
    rule: uncertainty alone ≠ needs_review; REVIEW needs explicit reason
  - Selection Actor cannot self-close these rules

p0_regression_fixtures:
  - examples/address-title-chen-xiaojie-id.yaml
  - examples/address-title-chen-xiaojie-ja.yaml
  - examples/title-kongjie-yiriqianli.yaml
  - examples/social-address-laozhang.yaml
  - examples/laopo-false-cognate.yaml
  - examples/shuoleshe-liangju.yaml
