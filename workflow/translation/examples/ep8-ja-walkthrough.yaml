schema_version: translation-decision-example/v0
id: TD-EX-007-ep8-ja-walkthrough
status: dogfood_walkthrough_pass_review_block_retune
purpose: >
  Ep8 zh→ja walkthrough after I21–I23 Finality revision.
  PASS / REVIEW / BLOCK — not blanket needs_review.
  Kinship via reference_resolution → Candidate Space (not fixed gloss).
  Human may still revise PASS; do not treat seeds as sole answers.

translation_context:
  source: { language: zh, locale: zh-CN }
  target: { language: ja, locale: ja-JP, script: Jpan, realization_profile: ja-JP }
  content: { type: subtitle, decision_mode: faithful_translation }

locale_taxonomy_bound:
  index: registry/locale-failure-taxonomy.yaml
  active: [cross_locale_core, ja-JP]
  taxonomy_ids: [F1-F9, CORE-F21, JA-F01-JA-F10]

reference_resolution:
  entities:
    - { id: E_sister, surface_forms: [我姐, 你姐, 姐], roles: [elder_sister] }
    - { id: E_jiefu, surface_forms: [姐夫], roles: [sisters_husband] }
  relationships:
    - { from: E_sister, to: E_jiefu, type: married_to }
  unresolved: []

selection_policy_global:
  - preserve_semantic_roles
  - preserve_modality
  - avoid_false_cognate
  - require_target_kinship_realization_after_reference
  - avoid_literal_idiom_translation
  - avoid_semantic_expansion
  - target_locale_naturalness

segments:
  - id: ep8-01
    src: "这是巴掌印"
    selection: { selected: "これは平手打ちの跡だ" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    note: PASS — literal identify; no voice/reference conflict

  - id: ep8-02
    src: "难道是我姐打的"
    selection: { selected: "まさか、姉さんが殴ったの？" }
    review: { required: false, reason: [] }
    validation: { modality: pass }
    finality: { status: accepted }
    guards: [JA-F10]
    note: PASS — 难道 modality preserved

  - id: ep8-03
    src: "你姐她也不是故意的"
    reference: { entity: E_sister, ambiguity: [elder_sister, wife_of_addressee] }
    candidates:
      - { text: "お姉さんもわざとじゃないよ", feasible: true }
      - { text: "妻もわざとじゃないよ", feasible: true }
    selection: { selected: "お姉さんもわざとじゃないよ" }
    review: { required: true, reason: [reference_ambiguous] }
    finality: { status: needs_review }
    note: REVIEW — discourse reference, not translation quality

  - id: ep8-04
    src: "我姐怎么可以这样"
    selection: { selected: "姉さんがこんなことするなんて" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-05
    src: "她怎么可以打你"
    selection: { selected: "彼女があなたを殴るなんて" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-06
    src: "我不怪她"
    selection: { selected: "彼女のことは責めない" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-07
    src: "我去帮你拿点药"
    selection: { selected: "薬を取ってきてあげる" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-08
    src: "我帮你"
    candidates:
      - { text: "手伝うわ", feasible: true }
      - { text: "僕がやる", feasible: true }
      - { text: "手伝うよ", feasible: true }
    selection: { selected: null }
    review: { required: true, reason: [character_voice_unknown, gendered_expression_unbound] }
    finality: { status: needs_review }
    note: REVIEW — Target Realization needs speaker gender/voice

  - id: ep8-09
    src: "姐夫好看吗"
    reference: { entity: E_jiefu, role: sisters_husband }
    candidate_space_kinship: [義兄さん, 義兄]
    infeasible: [{ text: "姐夫", reason: kinship_target_residue }]
    selection: { selected: "義兄さん、似合ってる？" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    guards: [JA-F05]
    note: PASS after reference→Candidate Space; 義兄さん is seed not sole mapping

  - id: ep8-10
    src: "我姐脾气暴躁"
    selection: { selected: "姉さんは気が短い" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-11
    src: "我替我姐向"
    analysis: { truncated: true }
    selection: { selected: null }
    review: { required: false, reason: [] }
    finality:
      status: blocked
      blocking_reasons: [source_truncated]
    guards: [CORE-F21]
    note: BLOCK — I21 do not invent 道歉

  - id: ep8-12
    src: "这丫头竟然发育的这么好"
    selection: { selected: "この娘、まさかこんなに発育がいいとは" }
    review: { required: true, reason: [platform_sensitive_content_gate] }
    finality: { status: needs_review }

  - id: ep8-13
    src: "糟了"
    selection: { selected: "まずい" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    note: PASS — short interjection

  - id: ep8-14
    src: "药酒的劲好像发作"
    selection: { selected: "薬酒の効き目が出てきたみたい" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    guards: [JA-F09]

  - id: ep8-15
    src: "姐夫下面好像有东西"
    reference: { entity: E_jiefu }
    selection: { selected: "義兄さん、下の方が当たってるみたい" }
    review: { required: true, reason: [platform_sensitive_content_gate] }
    finality: { status: needs_review }
    guards: [JA-F05]

  - id: ep8-16
    src: "顶到我了"
    selection: { selected: "当たっちゃった" }
    review: { required: true, reason: [platform_sensitive_content_gate] }
    finality: { status: needs_review }

  - id: ep8-17
    src: "你先回房休息"
    selection: { selected: "先に部屋で休んでて" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-18
    src: "我去替你收拾房间"
    selection: { selected: "部屋、片付けておくね" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-19
    src: "姐夫"
    reference: { entity: E_jiefu }
    candidate_space_kinship: [義兄さん, 義兄]
    selection: { selected: "義兄さん" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    guards: [JA-F05]

  - id: ep8-20
    src: "我姐是女强人"
    analysis:
      structure:
        - span: "女强人"
          type: pragmatic_expression
          lexical_handling: { mode: culturally_bound }
    candidates:
      - { text: "姉さんはバリバリのキャリアウーマンだ", feasible: true }
      - { text: "姉さんは仕事のできる女だ", feasible: true }
      - { text: "姉さんは女の強人だ", feasible: false, reason: false_cognate_or_calque }
    selection: { selected: "姉さんはバリバリのキャリアウーマンだ" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    note: PASS semantic-equivalent regression — seed ≠ sole answer
    guards: [JA-F09]

  - id: ep8-21
    src: "一心都在工作上"
    selection: { selected: "仕事一筋で" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    note: PASS — not-word-for-word is NOT a review reason

  - id: ep8-22
    src: "你平时肯定没少受委屈"
    selection: { selected: "普段、ずいぶん我慢してるんでしょ" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    guards: [JA-F10]

  - id: ep8-23
    src: "受点委屈倒是没什么"
    selection: { selected: "少し我慢するくらいならいいけど" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-24
    src: "我只怕你姐"
    analysis: { truncated: true }
    selection: { selected: null }
    finality:
      status: blocked
      blocking_reasons: [source_truncated]
    guards: [CORE-F21]

  - id: ep8-25
    src: "怕我姐什么"
    selection: { selected: "姉さんの何が怖いの？" }
    review: { required: false, reason: [] }
    finality: { status: accepted }

  - id: ep8-26
    src: "怕你姐给我戴绿帽子"
    analysis:
      structure:
        - span: "戴绿帽子"
          type: idiom
          lexical_handling: { mode: idiomatic }
    candidates:
      - { text: "お姉さんに浮気されるのが怖い", feasible: true }
      - { text: "お姉さんに緑の帽子をかぶせられるのが怖い", feasible: false, reason: idiom_literalization }
    selection: { selected: "お姉さんに浮気されるのが怖い" }
    review: { required: false, reason: [] }
    finality: { status: accepted }
    guards: [JA-F08]
    note: PASS idiom → semantic_equivalent

disposition_summary:
  accepted_pass: [1, 2, 4, 5, 6, 7, 9, 10, 13, 14, 17, 18, 19, 20, 21, 22, 23, 25, 26]
  needs_review: [3, 8, 12, 15, 16]
  blocked: [11, 24]

human_review:
  instruction: >
    Challenge PASS if cast/voice wrong. Prefer revise selected, not blanket REVIEW.
    Do not accept 姐夫 residue or 緑の帽子 literal. Truncated stay BLOCKED.
