schema_version: artifact-record/v1
id: translation.translation-decision
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1/3 reinforcement；未接 runtime

record: translation_decision_record
alias: TDR
purpose: >
  Canonical decision record for one segment translation.
  Locale → Content-Type → Expression+Semantic Analysis → Realization seeds
  → Candidate Space → Constraints → Feasible → Selection (incl. Target
  Syntax／Naturalness under I14–I16) → Validation → Finality.

required_fields:
  id: { type: text }
  translation_context: { type: object, ref_shape: translation.translation-context }
  source_text: { type: text }
  expression_analysis: { type: object, ref_shape: translation.expression-analysis }
  candidate_space:
    type: object
    note: >
      May include name_realization / title_realization / idiom_equivalent sub-spaces.
      Seeds from registry + knowledge; NOT the selected string (I5, I10).
  constraints:
    preserve: { type: list }
    prohibit: { type: list }
  candidates:
    type: list
    item:
      text: { type: text }
      strategy: { type: text }
      feasible: { type: bool }
      reason: { type: text, required_when: "feasible == false" }
      decision_class:
        type: enum
        optional: true
        values: [translation, adaptation, marketing_generation]
        note: marketing_generation without upstream evidence is not feasible (I12)
  selection:
    policy: { type: list, note: explicit; required (I6) }
    selected: { type: text }
    rationale: { type: text }
    decision_basis: { type: list, note: artifact refs; not only natural-language praise }

optional_fields:
  semantic_structure:
    type: object
    note: may embed or ref expression_analysis.semantic_structure for TDR completeness
  target_realization:
    type: object
    note: >
      Optional planning block after Selection Policy:
      semantic_realize → syntax_realize → naturalness_realize.
      Reorder/omit allowed only under I15; naturalness under I16.
    fields:
      syntax_plan: { type: text, optional: true }
      naturalness_notes: { type: text, optional: true }
  realization:
    type: object
    note: optional explicit Target-Locale Realization block (names/scripts)
  review: { type: object }
  validation: { type: object, ref_shape: translation.validation }
  finality: { type: object, ref_shape: translation.finality }
  waivers: { type: list }

invariants:
  - id: I3
    rule: TranslationContext required; src/dst-only path forbidden
  - id: I5
    rule: candidate_space ≠ candidates[] (feasible set); ≠ selection.selected
  - id: I6
    rule: selection.policy MUST be present and non-empty
  - id: I7
    rule: Selection Actor may choose among feasible candidates only; MUST NOT own Constraint Responsibility
  - id: I10
    rule: registry/knowledge seeds populate candidate_space only; MUST NOT be final answer without Selection
  - id: I11
    rule: >
      Translation Strategy ≠ Target-Locale Realization. Incomplete name realization
      → validation.name_realization=review (not auto-fail).
  - id: I12
    rule: >
      invented_information (claims/hashtags/plot/emotion absent from source+evidence)
      is prohibited. Title adaptation (Mode B) may reshape hook style but MUST NOT
      add unsupported marketing claims. Classify outputs as translation | adaptation |
      marketing_generation; marketing_generation without allow_marketing_expansion
      → feasible=false or validation blocking accepted.
  - id: I13
    rule: >
      Failure patterns seed Constraints/Validation only after Governance Review
      (status=active). Selection Actor MUST NOT self-promote candidates, rewrite
      guards, or accumulate locale case lists in the Selection prompt.
  - id: I14
    rule: Translation preserves semantic relations, not source surface form.
  - id: I15
    rule: >
      Target-language syntax may reorder, omit, or restructure surface elements
      only when corresponding semantic relations remain preserved.
  - id: I16
    rule: >
      Naturalness optimization MUST NOT introduce, remove, or alter
      source-supported semantic roles, entities, temporal references,
      polarity, or intent.
  - rule: selection.selected MUST be in candidates where feasible==true (unless explicit waiver)
  - rule: selection.decision_basis MUST list artifact bases

forbidden:
  - llm_rewriting_constraints
  - llm_self_promoting_failure_patterns_to_active
  - accumulating_locale_if_case_lists_in_selection_prompt
  - selecting_from_infeasible_set_without_waiver
  - collapsing_candidate_space_into_single_forced_output
  - requiring_source_word_order_equals_target_word_order
  - naturalness_that_drops_or_adds_semantic_roles
  - quality_or_confidence_scalar_as_closure
  - equating_latin_name_plus_honorific_with_complete_ja_name_realization
  - hard_fail_all_non_katakana_names
  - invented_marketing_hashtags_or_claims_without_upstream_evidence
  - literal_idiom_guess_as_sole_title_candidate_without_ambiguity_space
  - defaulting_familiar_prefix_to_literal_old_age_gloss
