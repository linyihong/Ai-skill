schema_version: artifact-record/v1
id: translation.expression-analysis
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1/3 ep7 reinforcement；未接 runtime

record: expression_analysis
purpose: >
  Intermediate artifact — lexical, semantic, syntactic, pragmatic, discourse,
  cultural layers. Semantic Structure bridges to Target Realization (I14).
  lexical_units drive Target-Language Lexical Realization (F18);
  lexical_handling flags false_cognate_risk (老婆≠お婆さん). Producer opaque.

required_fields:
  surface: { type: text }
  composite_type:
    type: list_or_text
    note: may list title+idiom; social_address+name; construction+speech_act
  structure:
    type: list
    item:
      span: { type: text }
      type: { type: text }
      role:
        type: text
        examples:
          - head
          - domain_modifier
          - familiarity_marker
          - surname
          - protagonist_descriptor
          - predicate
          - patient
      handling:
        type: text
        examples:
          - name_realization
          - locale_aware
          - lexicalized
          - idiomatic
          - pragmatic_construction
          - social_address
          - grammatical_relation
      lexical_handling:
        type: object
        optional: true
        fields:
          mode:
            type: enum
            values:
              - literal
              - lexicalized
              - idiomatic
              - collocational
              - false_cognate_risk
              - culturally_bound
            note: >
              false_cognate_risk / lexicalized → forbid character-wise kanji
              gloss as sole Candidate (I17).
      ambiguity:
        type: list
        optional: true
      realization:
        type: object
        optional: true
        fields:
          strategies: { type: list }

optional_fields:
  analysis_layers:
    type: list
    values_hint: [lexical, semantic, syntactic, pragmatic, discourse, cultural]
  lexical_units:
    type: list
    optional: true
    note: >
      Source lexical units requiring Target-Language Lexical Realization (F18).
      Not a script/Han dump — each unit carries target_realization risk.
    item:
      source_span: { type: text }
      lexical_role: { type: text, examples: [noun, head, domain_modifier, kinship, title] }
      source_lexeme: { type: text }
      target_realization:
        type: object
        fields:
          required: { type: bool }
          risk: { type: enum, values_hint: [low, medium, high] }
          reason:
            type: list
            values_hint:
              - cjk_shared_script
              - lexical_equivalence_uncertain
              - shared_han_false_confidence
              - source_lexeme_may_not_exist_in_target
              - morphology_or_collocation_risk
          layers_hint:
            type: list
            optional: true
            values_hint:
              - script_legality          # L1: Han present ≠ error
              - target_lexical_existence # L2: whole unit used in target?
              - semantic_equivalence     # L3: same chars ≠ same meaning
              - contextual_naturalness   # L4: Selection responsibility
  semantic_structure:
    type: object
    fields:
      predicate: { type: text }
      # Compound / title: head + domain modifier feeds lexical_units + F18
      head: { type: text, optional: true, note: "e.g. 回忆录 in 校园回忆录" }
      modifier:
        type: object
        optional: true
        fields:
          target: { type: text, note: "e.g. 校园" }
          relation:
            type: enum
            values_hint: [context_domain, attribute, familiar_prefix, other]
      arguments:
        type: list
        item:
          role:
            type: enum
            values_hint:
              [agent, experiencer, patient, theme, object, recipient, beneficiary, other]
          span: { type: text }
      modifiers: { type: list }
      temporal: { type: list }
      location: { type: list }
      manner: { type: list }
      purpose: { type: list }
      condition: { type: list }
      polarity: { type: enum, values_hint: [affirmative, negative, unknown] }
      modality:
        type: object
        optional: true
        fields:
          uncertainty: { type: enum, values_hint: [none, speculative, tentative, unknown] }
          speech_act: { type: text, optional: true }
        note: 该不会…吧 → speculative; must not drop (I19)
      social_address: { type: object, optional: true }
  target_realization_risk:
    type: list
    optional: true
    values_hint:
      - target_lexical_realization_uncertain
      - shared_script_false_confidence
      - source_composition_may_not_map_to_target
      - lexical_decomposition_risk
      - source_word_order_may_not_map_to_target
    note: >
      When set, Candidate Space MUST include target-language lexical
      realizations (not source-lexeme preserve / token-wise reassembly).
      Seeds F18 / JA-F12.
  semantic_roles:
    type: list
    item:
      role: { type: text }
      source: { type: text }
      target: { type: text, optional: true }
  reference_resolution:
    type: object
    optional: true
    note: >
      Discourse referents／kinship／cast identity before surface Selection.
      姐夫／姐／老婆／赵伟 → resolved entity + relationship, then realization.
    fields:
      entities: { type: list }
      relationships: { type: list }
      established_names: { type: list, note: series_cast / prior TDR forms }
  title_structure:
    type: object
    fields:
      is_title: { type: bool }
      is_truncated_or_nonstandard: { type: bool }
      has_part_marker: { type: bool }
      has_idiom: { type: bool }
      platform_metadata_present: { type: bool }
  literal_meaning: { type: list }
  pragmatic_meaning: { type: list }
  register:
    type: object
    optional: true
    fields:
      source: { type: text, examples: [colloquial, formal, literary] }
      target_required: { type: text, optional: true }
  speaker_intent: { type: list }
  ambiguity: { type: list }
  producer:
    type: enum
    values: [registry_matcher, dictionary, hybrid, llm, human, other]
  strategy_hints: { type: object }

invariants:
  - id: I4
    rule: Expression Analysis is an artifact; contracts MUST NOT require LLM-as-producer
  - rule: no Expression Analysis → no DECIDE / Selection
  - id: I11-analysis
    rule: proper_name realization strategies seed Candidate Space only
  - id: I12-analysis
    rule: title Structure + idiom ambiguity before Selection when content.type=title
  - id: I14-analysis
    rule: multi-argument clauses SHOULD populate semantic_structure / semantic_roles
  - id: I14b-analysis
    rule: social_address_marker MUST NOT default to literal age/kin gloss
  - id: I17-analysis
    rule: >
      Lexicalized kinship／relationship terms and false_cognate_risk spans
      MUST NOT use character-wise Chinese→Japanese kanji decomposition as the
      sole feasible Candidate (老婆≠お婆さん).
  - id: I19-analysis
    rule: >
      Speculative／tentative constructions (该不会…吧) SHOULD populate
      semantic_structure.modality; speech-act constructions (说了她两句)
      SHOULD use speech_act_expression / construction types.
  - id: I25-analysis
    rule: >
      Lexical units that share script with the target (esp. CJK→ja) or
      compound／title spans SHOULD populate lexical_units[].target_realization
      + optional semantic_structure.head／modifier, then Target Lexical
      Realization Candidate Space — not source-lexeme preserve or
      token-wise reassembly as sole feasible (F18).

forbidden:
  - equating_expression_analysis_with_ai_analysis_step
  - source_text_to_translation_without_analysis_artifact
  - treating_latin_transliteration_as_complete_ja_name_realization
  - character_wise_kanji_gloss_as_sole_candidate_for_false_cognate_risk
  - dictionary_gloss_only_for_pragmatic_constructions
  - token_mapping_without_semantic_roles_for_multi_argument_clauses
  - treating_familiar_prefix_as_literal_old_by_default
  - assuming_shared_han_form_is_japanese_lexeme
  - source_lexeme_preserve_as_sole_feasible_for_high_risk_units
  - treating_script_legal_han_as_automatic_pass
