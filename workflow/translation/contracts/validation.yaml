schema_version: artifact-record/v1
id: translation.validation
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1/3 ep7 reinforcement；未接 runtime

record: translation_validation
purpose: >
  Multi-dimension validation. No single translation_quality score.
  semantic ≠ syntactic ≠ grammatical ≠ naturalness ≠ lexical ≠
  semantic_roles ≠ modality ≠ semantic_expansion (I14–I20／F18).
  Mechanical gates not self-certified.

dimensions:
  semantic: { type: enum, values: [pass, fail, review] }
  lexical:
    type: enum
    values: [pass, fail, review]
    note: >
      Target Lexical Realization (F18／JA-F12). Script-legal ≠ target
      lexeme ≠ semantic equivalent ≠ contextually natural. L4 naturalness
      stays Selection-constrained; mechanical gates may fail L2／L3 only.
  semantic_roles:
    type: enum
    values: [pass, fail, review]
    note: Completeness of agent／patient／recipient／theme／temporal／polarity (F1／JA-F03).
  modality:
    type: enum
    values: [pass, fail, review]
    note: >
      Speculative／tentative／speech-act force (该不会…吧, 我说了…) must not
      collapse without trace (I19／JA-F10).
  semantic_expansion:
    type: enum
    values: [pass, fail, review]
    note: >
      I18. Fluency-driven addition of unsupported content (振る舞い) — distinct
      from marketing invented_information; both block accepted without waiver.
  intent: { type: enum, values: [pass, fail, review] }
  register:
    type: enum
    values: [pass, fail, review]
    note: >
      I20. Meaning-correct + register elevation/depression (colloquial→べし)
      → fail or review (JA-F07).
  terminology: { type: enum, values: [pass, fail, review] }
  cultural: { type: enum, values: [pass, fail, review] }
  format: { type: enum, values: [pass, fail, review] }
  completeness: { type: enum, values: [pass, fail, review] }
  syntactic: { type: enum, values: [pass, fail, review] }
  grammatical: { type: enum, values: [pass, fail, review] }
  naturalness:
    type: enum
    values: [pass, fail, review]
    note: Under I16／I18 — must not expand semantics for fluency.

locale_consistency:
  status: { type: enum, values: [pass, fail, review] }
  reason: { type: text, examples: [target_locale_residue] }
  note: Untranslated kinship (姐夫) in ja-JP → fail (JA-F05).

name_realization:
  status: { type: enum, values: [pass, fail, review] }
  reason: { type: text, examples: [name_realization_incomplete] }
  preferred_script: { type: text, optional: true }
  note: Identity + series_cast + script_policy — not auto zh→ja kanji (JA-F06).

invented_information:
  status: { type: enum, values: [pass, fail, review] }
  reason: { type: text, examples: [unsupported_marketing_claim, invented_hashtag] }

mechanical:
  segment_coverage: { type: enum, values: [pass, fail] }
  placeholders: { type: enum, values: [pass, fail] }
  numbers: { type: enum, values: [pass, fail] }
  proper_names: { type: enum, values: [pass, fail, review] }
  tags_markup: { type: enum, values: [pass, fail] }
  source_language_residue: { type: enum, values: [pass, fail, review] }
  clock_time: { type: enum, values: [pass, fail, review], optional: true }

residue_columns:
  source_language_residue:
    meaning: residual tokens from SOURCE language in dst
  target_locale_residue:
    meaning: dst inconsistent with TARGET locale (含未譯 姐夫)
  name_realization_incomplete:
    meaning: name not realized per realization_profile
  invented_information:
    meaning: unsupported marketing claims/hashtags
  semantic_expansion:
    meaning: fluency adds source-unsupported entities／predicates
  semantic_role_loss:
    meaning: source role missing without evidence
  social_address_misinterpretation:
    meaning: familiar prefix → literal age/kin
  chinese_lexical_false_cognate:
    meaning: character-wise zh→ja kanji friend error (老婆→お婆さん)

invariants:
  - id: I8
    rule: source_language_residue ≠ target_locale_residue
  - id: I11
    rule: name_realization ≠ locale_consistency column
  - id: I12
    rule: invented_information ≠ marketing-as-translation
  - id: I14
    rule: Preserve semantic relations, not source surface form
  - id: I15
    rule: Target reorder/omit OK only when relations preserved
  - id: I16
    rule: Naturalness MUST NOT alter roles/entities/temporal/polarity/intent
  - id: I17
    rule: False cognate / lexical decomposition MUST be flagged; no sole kanji gloss
  - id: I18
    rule: semantic_expansion distinct from invented_information; both block without waiver
  - id: I19
    rule: Preserve participants, event, modality/uncertainty, polarity
  - id: I20
    rule: Meaning-correct + register drift → register fail or review
  - rule: Selection Actor MUST NOT self-close locale/name/invented/expansion/roles/modality/mechanical
  - rule: untranslated kinship in ja-JP → locale_consistency fail
  - rule: Forbidden to hard-fail all non-katakana foreign names
  - rule: Forbidden to require source_token_order == target_token_order

forbidden:
  - single_scalar_translation_quality
  - merging_source_and_target_locale_residue
  - merging_name_realization_into_locale_consistency
  - merging_naturalness_into_grammatical_or_semantic
  - merging_semantic_expansion_into_naturalness_pass
  - treating_invented_hashtags_as_harmless_adaptation
  - requiring_source_word_order_in_target
  - character_wise_kanji_gloss_as_sole_zh_ja_candidate
  - llm_waiver_by_vibes_without_explicit_waiver_record
  - hard_fail_non_katakana_foreign_names
