schema_version: artifact-record/v1
id: translation.translation-context
status: draft
runtime_projection:
  enabled: false
  reason: workflow-local；Phase 1/3 reinforcement；未接 runtime

record: translation_context
purpose: >
  Authoritative where-am-I-translating binding for every Translation Decision.
  Locales come from consumer / job / locale pack — not per-segment language detection.
  content.type selects policy family (subtitle ≠ title ≠ ui ≠ description).

required_fields:
  source:
    language: { type: text, note: ISO 639-ish short code }
    locale: { type: bcp47, note: authoritative; may include region }
  target:
    language: { type: text }
    locale: { type: bcp47, note: AUTHORITATIVE INPUT — Constraint, not Selection }

optional_fields:
  source.dialect: { type: text }
  source.register: { type: text }
  target.script: { type: text, examples: [Latn, Hans, Hant, Jpan] }
  target.variant: { type: text }
  target.register: { type: text }
  target.realization_profile:
    type: text
    examples: [ja-JP, id-ID, en-US]
    note: >
      Optional profile id for Target-Locale Realization preferences
      (e.g. preferred_script=katakana). Preference constrains Candidate Space;
      does NOT hard-fail non-preferred scripts without waiver policy.
  content:
    type:
      type: enum
      values: [subtitle, title, description, ui, hashtag, other]
      note: REQUIRED when known; missing → treat as needs_review for non-dialogue surfaces
    subtype:
      type: text
      examples: [short_drama_title, episode_title, platform_hashtag]
    decision_mode:
      type: enum
      values: [faithful_translation, title_adaptation]
      default: faithful_translation
      note: >
        Mode A faithful_translation — no new plot/emotion/marketing claim.
        Mode B title_adaptation — may reshape hook style; still MUST NOT invent
        unsupported marketing claims (I12).
  structure:
    part: { type: text, examples: ["1", "上", "Part One"] }
  consumer_ref: { type: text, note: e.g. NVP locale pack / job id }
  episode: { type: text }
  scene: { type: text }
  speaker:
    type: object
    optional: true
    fields:
      entity_ref: { type: text, note: reference_resolution entity id }
      gender: { type: enum, values_hint: [female, male, unknown, na] }
      character_profile: { type: text, optional: true }
  addressee:
    type: object
    optional: true
    fields:
      entity_ref: { type: text }
      gender: { type: enum, values_hint: [female, male, unknown, na] }
  relationship:
    type: text
    optional: true
    examples: [siblings, spouses, in_laws, colleagues, strangers]
    note: discourse relationship between speaker and addressee
  target_realization:
    type: object
    optional: true
    note: >
      Preferences constraining Target Realization Candidate Space — not the
      selected surface. Selection chooses among feasible under these + guards.
    fields:
      register: { type: text, examples: [colloquial, polite, intimate] }
      character_voice: { type: text, optional: true }
      politeness: { type: text, examples: [plain, desu_masu, honorific] }
      gendered_expression:
        type: enum
        values_hint: [feminine, masculine, neutral, unknown]
        note: unbound + required for short utterance → review.reason character_voice_unknown
  marketing_tags:
    type: list
    note: only when upstream evidence explicitly provides; never inferred by Selection Actor
  title_adaptation_constraints:
    allow_marketing_expansion: { type: bool, default: false }

invariants:
  - id: I1
    rule: TranslationContext MUST exist on every Translation Decision path
  - id: I2
    rule: target_locale is authoritative input, not an inferred translation decision
  - id: I2b
    rule: Locale Resolution binds consumer locales; it is NOT Language Detection
  - id: I3-partial
    rule: actors MUST consume TranslationContext; src/dst alone is insufficient
  - id: I11-partial
    rule: >
      realization_profile preferences (e.g. preferred_script) constrain
      Candidate Space; MUST NOT encode as all_foreign_names→katakana hard FAIL
  - id: I12-partial
    rule: >
      content.type selects Selection Policy family. Title/headline MUST NOT be
      treated as ordinary subtitle sentence without Title Structure Analysis.
  - id: I12b
    rule: >
      allow_marketing_expansion defaults false. Hashtags/claims absent from
      source+evidence → invented_information (blocking or review).
  - id: I24-partial
    rule: >
      speaker/addressee/relationship/scene feed Target Realization; missing
      gendered_expression when short dialogue needs it → review.reason, not invent.

forbidden:
  - inferring_target_locale_from_segment_text_via_llm
  - omitting_translation_context_on_decision
  - treating_target_language_as_equivalent_to_target_locale
  - hard_fail_non_katakana_foreign_names
  - inventing_marketing_tags_without_upstream_evidence
  - treating_short_drama_title_as_ordinary_dialogue_sentence
  - inventing_speaker_gender_to_force_accepted

notes:
  - language ≠ locale ≠ dialect ≠ register ≠ script ≠ realization_profile ≠ content.type
  - Content-Type / Context Resolution sits after Locale Resolution
  - Reference Resolution (dialogue) sits after Context, before Expression Analysis
  - NVP path: caption-locale-pack.locale → translation_context.target
  - Realization ≠ Translation Strategy (see registry/realization-strategies.yaml)
