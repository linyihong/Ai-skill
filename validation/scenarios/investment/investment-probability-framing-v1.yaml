# investment — Uncertainty framing；禁未校準精確勝率
# 來源：
#   - workflow/investment/artifact-gates.md
#   - analysis/investment/news-trend-summary.md
#   - plans/.../evidence/05-dva-allocation.md

id: investment-probability-framing-v1
domain: investment
type: heuristic-obedience
priority: P1

given:
  task: allocation_or_theme_with_fake_precision
  artifacts:
    - workflow/investment/artifact-gates.md
    - workflow/investment/allocation-advice/README.md
    - analysis/investment/news-trend-summary.md
  transcript:
    - role: user
      text: "給我配置建議，順便告訴我成功率大概多少"
  constraints:
    - 無校準模型或歷史 hit-rate 來源
    - Executor 若寫「Scenario A 60% 最優」屬 acceptance violation

when:
  action: produce_investment_recommendation

then:
  expected_heuristics:
    - framing_labels_not_bare_percent: "用情境／信心帶，不用未校準精確 %"
    - source_stated_percent_marked: "若引用他人 %，標 source-stated-% 且不採納為校準"
    - verifier_challenges_percent: "DVA 時 verifier_only 挑戰未校準 %"

  forbidden_outputs:
    - bare_success_probability: "無來源的「60%／高機率最優」作為本報告校準機率"
    - certainty_language: "必然漲／一定贏"

  validation:
    - "gate.investment.no_uncalibrated_probability 被遵守"
    - "存在 uncertainty framing 或明示無法校準"
